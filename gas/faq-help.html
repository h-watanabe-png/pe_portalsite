<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ・ヘルプ - PEポータルサイト</title>
  <link rel="stylesheet" href="common.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    .search-container {
      margin-bottom: 32px;
    }
    
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .search-box input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }
    
    .search-box button {
      padding: 12px 24px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .search-box button:hover {
      background: #1557b0;
    }
    
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .filter-tab {
      padding: 8px 16px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      font-weight: 500;
      color: #202124;
    }
    
    .filter-tab:hover {
      background: #f8f9fa;
      border-color: #1a73e8;
    }
    
    .filter-tab.active {
      background: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }
    
    .search-results {
      margin-top: 20px;
    }
    
    .result-item {
      background: #ffffff;
      border: 1px solid #e8eaed;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
      transition: box-shadow 0.2s;
    }
    
    .result-item:hover {
      box-shadow: 0 2px 6px rgba(60, 64, 67, 0.3), 0 2px 8px 2px rgba(60, 64, 67, 0.15);
    }
    
    .result-item h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #1a73e8;
      font-size: 18px;
      font-weight: 500;
    }
    
    .result-item p {
      color: #5f6368;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    
    .result-item .result-meta {
      font-size: 12px;
      color: #5f6368;
      margin-top: 12px;
    }
    
    .result-item .result-tags {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .result-item .result-tag {
      display: inline-block;
      padding: 4px 12px;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .result-item .result-link {
      display: inline-block;
      margin-top: 12px;
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    
    .result-item .result-link:hover {
      text-decoration: underline;
    }
    
    .add-knowledge-section {
      margin-top: 32px;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e8eaed;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }
    
    .add-knowledge-section h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
      font-weight: 500;
      color: #202124;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FAQ・ヘルプ</h1>
      <div class="user-info">
        <a href="?path=index" class="nav-link">ホームに戻る</a>
      </div>
    </header>
    
    <main>
      <section class="search-container">
        <h2 class="section-title">ナレッジ検索</h2>
        <div class="card">
          <div class="search-box">
            <input type="text" id="search-query" placeholder="キーワードで検索（ファイル名、タグ、説明など）" />
            <button onclick="performSearch()">検索</button>
          </div>
          
          <div class="filter-tabs">
            <div class="filter-tab active" data-category="" onclick="filterByCategory('')">すべて</div>
            <div class="filter-tab" data-category="システム" onclick="filterByCategory('システム')">システム</div>
            <div class="filter-tab" data-category="経理" onclick="filterByCategory('経理')">経理</div>
            <div class="filter-tab" data-category="その他" onclick="filterByCategory('その他')">その他</div>
          </div>
        </div>
      </section>
      
      <section class="section">
        <h2 class="section-title">検索結果</h2>
        <div class="card">
          <div id="search-results">
            <div class="empty-state">
              <div class="empty-state-icon">🔍</div>
              <div class="empty-state-message">検索キーワードを入力して検索してください</div>
            </div>
          </div>
        </div>
      </section>
      
      <section class="section add-knowledge-section">
        <h2 class="section-title">ナレッジを追加</h2>
        <p style="color: #5f6368; margin-bottom: 24px;">Google Driveのファイルやナレッジを追加して、他のユーザーと共有できます。</p>
        
        <form id="add-knowledge-form">
          <div class="form-group">
            <label for="knowledge-file-id">Google DriveファイルID（オプション）</label>
            <input type="text" id="knowledge-file-id" placeholder="Google DriveのファイルIDを入力（URLから取得可能）" />
            <small>例: ファイルのURLが https://drive.google.com/file/d/1ABC.../view の場合、1ABC... の部分</small>
          </div>
          
          <div class="form-group">
            <label for="knowledge-title">タイトル *</label>
            <input type="text" id="knowledge-title" required />
          </div>
          
          <div class="form-group">
            <label for="knowledge-category">カテゴリ *</label>
            <select id="knowledge-category" required>
              <option value="">選択してください</option>
              <option value="システム">システム</option>
              <option value="経理">経理</option>
              <option value="その他">その他</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="knowledge-description">説明 *</label>
            <textarea id="knowledge-description" required placeholder="ナレッジの説明を記入してください"></textarea>
          </div>
          
          <div class="form-group">
            <label for="knowledge-tags">タグ（カンマ区切り）</label>
            <input type="text" id="knowledge-tags" placeholder="例: マニュアル, 手順, トラブルシューティング" />
          </div>
          
          <button type="submit" class="btn btn-primary">追加</button>
        </form>
      </section>
    </main>
  </div>
  
  <script>
    let currentCategory = '';
    
    // 検索実行
    function performSearch() {
      const query = document.getElementById('search-query').value.trim();
      
      if (!query || query.length < 2) {
        showError('検索キーワードを2文字以上入力してください');
        return;
      }
      
      showLoading();
      
      // POSTリクエストで検索
      const url = window.location.href.split('?')[0];
      fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'search_knowledge',
          query: query,
          category: currentCategory,
          limit: 50
        })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('検索リクエストが失敗しました');
        }
        return response.json();
      })
      .then(result => displaySearchResults(result))
      .catch(error => {
        console.error('検索エラー:', error);
        showError('検索中にエラーが発生しました: ' + error.toString());
      });
    }
    
    // カテゴリでフィルタ
    function filterByCategory(category) {
      currentCategory = category;
      
      // タブの表示を更新
      document.querySelectorAll('.filter-tab').forEach(tab => {
        if (tab.dataset.category === category) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });
      
      // 検索クエリがある場合は再検索
      const query = document.getElementById('search-query').value.trim();
      if (query) {
        performSearch();
      }
    }
    
    // 検索結果を表示
    function displaySearchResults(result) {
      hideLoading();
      
      if (!result.success) {
        showError(result.error);
        return;
      }
      
      const resultsContainer = document.getElementById('search-results');
      
      if (result.total === 0) {
        resultsContainer.innerHTML = '<p>検索結果が見つかりませんでした。</p>';
        return;
      }
      
      let html = `<h2>検索結果（${result.total}件）</h2>`;
      
      // ファイル結果
      if (result.results.files.length > 0) {
        html += '<h3>ファイル</h3>';
        result.results.files.forEach(file => {
          html += `
            <div class="result-item">
              <h3>${escapeHtml(file.title)}</h3>
              <p>${escapeHtml(file.description || '説明なし')}</p>
              <div class="result-tags">
                ${file.tags.map(tag => `<span class="result-tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
              <div class="result-meta">
                種類: ${file.mimeType} | 更新日: ${formatDate(file.lastModified)}
              </div>
              <a href="${file.url}" target="_blank" class="result-link">ファイルを開く →</a>
            </div>
          `;
        });
      }
      
      // ナレッジベース結果
      if (result.results.knowledgeBase.length > 0) {
        html += '<h3>ナレッジベース</h3>';
        result.results.knowledgeBase.forEach(knowledge => {
          html += `
            <div class="result-item">
              <h3>${escapeHtml(knowledge.title)}</h3>
              <p>${escapeHtml(knowledge.content.substring(0, 200))}...</p>
              <div class="result-tags">
                ${knowledge.tags.map(tag => `<span class="result-tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
              <div class="result-meta">
                カテゴリ: ${knowledge.category} | 更新日: ${formatDate(knowledge.updatedAt)}
              </div>
              <div class="result-feedback" style="margin-top: 8px;">
                <button class="btn-feedback" onclick="saveFAQFeedback('${knowledge.id}', '${escapeHtml(result.query)}', true)" title="役に立ちました">
                  👍
                </button>
                <button class="btn-feedback" onclick="saveFAQFeedback('${knowledge.id}', '${escapeHtml(result.query)}', false)" title="役に立ちませんでした">
                  👎
                </button>
              </div>
            </div>
          `;
        });
      }
      
      // FAQ結果
      if (result.results.faq.length > 0) {
        html += '<h3>FAQ</h3>';
        result.results.faq.forEach(faq => {
          html += `
            <div class="result-item">
              <h3>${escapeHtml(faq.title)}</h3>
              <p>${escapeHtml(faq.description || '')}</p>
              <div class="result-tags">
                ${faq.tags.map(tag => `<span class="result-tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
              ${faq.link ? `<a href="${faq.link}" target="_blank" class="result-link">詳細を見る →</a>` : ''}
              <div class="result-feedback" style="margin-top: 8px;">
                <button class="btn-feedback" onclick="saveFAQFeedback('${faq.id}', '${escapeHtml(result.query)}', true)" title="役に立ちました">
                  👍
                </button>
                <button class="btn-feedback" onclick="saveFAQFeedback('${faq.id}', '${escapeHtml(result.query)}', false)" title="役に立ちませんでした">
                  👎
                </button>
              </div>
            </div>
          `;
        });
      }
      
      resultsContainer.innerHTML = html;
    }
    
    // ナレッジ追加フォーム送信
    document.getElementById('add-knowledge-form').addEventListener('submit', function(e) {
      e.preventDefault();
      addKnowledge();
    });
    
    function addKnowledge() {
      const fileId = document.getElementById('knowledge-file-id').value.trim();
      const title = document.getElementById('knowledge-title').value.trim();
      const category = document.getElementById('knowledge-category').value;
      const description = document.getElementById('knowledge-description').value.trim();
      const tags = document.getElementById('knowledge-tags').value.split(',').map(t => t.trim()).filter(t => t);
      
      if (!title || !category || !description) {
        showError('タイトル、カテゴリ、説明は必須です');
        return;
      }
      
      showLoading();
      
      // POSTリクエストで送信
      const requestData = {
        title: title,
        category: category,
        content: description,
        description: description,
        tags: tags,
        fileId: fileId
      };
      
      const url = window.location.href.split('?')[0];
      fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'add_knowledge',
          ...requestData
        })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('ナレッジ追加リクエストが失敗しました');
        }
        return response.json();
      })
      .then(result => onKnowledgeAdded(result))
      .catch(error => {
        console.error('ナレッジ追加エラー:', error);
        showError('ナレッジ追加中にエラーが発生しました: ' + error.toString());
      });
    }
    
    function onKnowledgeAdded(result) {
      hideLoading();
      
      if (result && result.success) {
        // 成功メッセージを表示
        const successMsg = document.createElement('div');
        successMsg.className = 'alert alert-success';
        successMsg.textContent = 'ナレッジを追加しました';
        const form = document.getElementById('add-knowledge-form');
        form.parentNode.insertBefore(successMsg, form);
        
        // 3秒後に非表示
        setTimeout(() => {
          successMsg.remove();
        }, 3000);
        
        document.getElementById('add-knowledge-form').reset();
        
        // 検索を再実行（オプション）
        const query = document.getElementById('search-query').value.trim();
        if (query) {
          performSearch();
        }
      } else {
        showError(result.error || 'ナレッジ追加に失敗しました');
      }
    }
    
    function showLoading() {
      const container = document.getElementById('search-results');
      container.innerHTML = `
        <div class="empty-state">
          <div class="loading-spinner" style="margin: 0 auto;"></div>
          <div class="empty-state-message" style="margin-top: 16px;">検索中...</div>
        </div>
      `;
    }
    
    function hideLoading() {
      // ローディングは既に結果で置き換えられる
    }
    
    function showError(error) {
      hideLoading();
      const container = document.getElementById('search-results');
      container.innerHTML = `
        <div class="alert alert-error">
          <strong>エラー</strong>: ${escapeHtml(error)}
        </div>
      `;
    }
    
    // グローバルにエラー表示関数を公開（ナレッジ追加フォームからも使用）
    window.showError = showError;
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function formatDate(date) {
      if (!date) return '';
      const d = new Date(date);
      return d.toLocaleDateString('ja-JP') + ' ' + d.toLocaleTimeString('ja-JP');
    }
    
    // Enterキーで検索
    document.getElementById('search-query').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        performSearch();
      }
    });
  </script>
</body>
</html>
