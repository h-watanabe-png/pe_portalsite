<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>システムチームへの依頼 - PEポータルサイト</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .form-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    
    .form-group label.required::after {
      content: ' *';
      color: #d32f2f;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
    }
    
    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    .form-group input[type="file"] {
      padding: 5px;
    }
    
    .form-actions {
      margin-top: 30px;
      text-align: center;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .btn-primary {
      background-color: #1976d2;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #1565c0;
    }
    
    .btn-primary:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background-color: #666;
      color: white;
    }
    
    .btn-secondary:hover {
      background-color: #555;
    }
    
    .error-message {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 5px;
    }
    
    .success-message {
      background-color: #e8f5e9;
      color: #2e7d32;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>システムチームへの依頼</h1>
      <div class="user-info">
        <a href="?path=index" class="nav-link">ホームに戻る</a>
      </div>
    </header>
    
    <main>
      <div id="success-message" class="success-message" style="display: none;"></div>
      
      <form id="system-team-request-form" class="form-container">
        <div class="form-group">
          <label for="requester-name" class="required">依頼者氏名</label>
          <input type="text" id="requester-name" name="requesterName" required>
        </div>
        
        <div class="form-group">
          <label for="brand" class="required">ブランド</label>
          <select id="brand" name="brand" required>
            <option value="">選択してください</option>
            <option value="PE">PE</option>
            <option value="EDUBAL">EDUBAL</option>
            <option value="その他">その他</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="urgency" class="required">緊急度</label>
          <select id="urgency" name="urgency" required>
            <option value="">選択してください</option>
            <option value="高">高</option>
            <option value="中">中</option>
            <option value="低">低</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="desired-date">対応希望日</label>
          <input type="date" id="desired-date" name="desiredDate">
          <div class="help-text">希望する対応日を選択してください（任意）</div>
        </div>
        
        <div class="form-group">
          <label for="household-id">世帯ID</label>
          <input type="text" id="household-id" name="householdId">
          <div class="help-text">該当する世帯IDがある場合に入力してください（任意）</div>
        </div>
        
        <div class="form-group">
          <label for="student-number">生徒番号</label>
          <input type="text" id="student-number" name="studentNumber">
          <div class="help-text">該当する生徒番号がある場合に入力してください（任意）</div>
        </div>
        
        <div class="form-group">
          <label for="selection-number">選考番号</label>
          <input type="text" id="selection-number" name="selectionNumber">
          <div class="help-text">該当する選考番号がある場合に入力してください（任意）</div>
        </div>
        
        <div class="form-group">
          <label for="issue" class="required">発生している問題</label>
          <textarea id="issue" name="issue" required placeholder="発生している問題を詳しく記入してください"></textarea>
        </div>
        
        <div class="form-group">
          <label for="desired-action">希望の対応</label>
          <textarea id="desired-action" name="desiredAction" placeholder="希望する対応内容を記入してください（任意）"></textarea>
        </div>
        
        <div class="form-group">
          <label for="frequency">発生頻度</label>
          <select id="frequency" name="frequency">
            <option value="">選択してください</option>
            <option value="初回">初回</option>
            <option value="時々">時々</option>
            <option value="頻繁">頻繁</option>
            <option value="常時">常時</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="error-message">エラー文・URL</label>
          <textarea id="error-message" name="errorMessage" placeholder="エラーメッセージや関連URLがある場合に入力してください（任意）"></textarea>
        </div>
        
        <div class="form-group">
          <label for="file-attachment">ファイル添付</label>
          <input type="file" id="file-attachment" name="fileAttachment" multiple>
          <div class="help-text">関連するファイルがある場合に添付してください（任意、複数選択可）</div>
        </div>
        
        <div class="form-group">
          <label for="memo">備考</label>
          <textarea id="memo" name="memo" placeholder="その他の情報があれば記入してください（任意）"></textarea>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">送信</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()">リセット</button>
        </div>
        
        <div id="error-message" class="error-message" style="display: none;"></div>
      </form>
    </main>
  </div>
  
  <script src="form-handler.js"></script>
  <script>
    // フォーム送信処理
    document.getElementById('system-team-request-form').addEventListener('submit', function(e) {
      e.preventDefault();
      submitSystemTeamRequest();
    });
    
    function resetForm() {
      document.getElementById('system-team-request-form').reset();
      hideMessages();
    }
    
    function hideMessages() {
      const successMsg = document.getElementById('success-message');
      const errorMsg = document.getElementById('error-message');
      if (successMsg) successMsg.style.display = 'none';
      if (errorMsg) errorMsg.style.display = 'none';
    }
    
    // グローバル関数として定義（form-handler.jsから呼び出される）
    window.submitSystemTeamRequest = submitSystemTeamRequest;
    window.showSuccess = showSuccess;
    window.showError = showError;
    window.hideMessages = hideMessages;
  </script>
</body>
</html>
